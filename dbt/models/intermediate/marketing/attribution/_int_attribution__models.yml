version: 2

models:
  - name: int_touchpoints
    description: >
      One row per person and campaign the person responded to. A member resolves to a person through its lead
      (any of the person's lead_ids) or its contact. Dated by first_responded_on, or the member's created date when
      that is null. When a person responded to a campaign more than once (e.g. through duplicate leads), the earliest
      response is kept; ties broken by member created_at, then campaign_member_id.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [email, campaign_id]
    columns:
      - name: campaign_member_id
        data_tests: [unique, not_null]
      - name: email
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_people')
                field: email
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_campaigns__current')
                field: campaign_id
      - name: touched_on
        data_tests: [not_null]

  - name: int_opportunity_touchpoints
    description: >
      One row per opportunity and touchpoint of a person on one of its contact roles, touched on or before the
      opportunity's created date. Touches after that date are excluded. Ordered within the opportunity by touched_on,
      then member created_at, then campaign_member_id. position is first, middle or last; an opportunity with a single
      touchpoint has position first, so last touch should use touch_number = touch_count. linear_share is
      1 / touch_count. Opportunities with no touchpoints have no rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [opportunity_id, campaign_member_id]
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [opportunity_id, touch_number]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "touched_on <= opportunity_created_on"
    columns:
      - name: opportunity_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_opportunities__current')
                field: opportunity_id
      - name: campaign_member_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_touchpoints')
                field: campaign_member_id
      - name: campaign_id
        data_tests: [not_null]
      - name: position
        data_tests:
          - accepted_values:
              arguments:
                values: [first, middle, last]
      - name: linear_share
        data_tests: [not_null]

  - name: int_person_source_campaign
    description: >
      One row per person in int_people with their source campaign: the campaign of their earliest touchpoint
      (int_touchpoints order), else of their earliest membership by created_at, ties broken by campaign_member_id.
      source_on is the touchpoint date or the membership created date. People with no membership have a null
      source_campaign_id and source_type.
    columns:
      - name: email
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_people')
                field: email
      - name: source_campaign_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_campaigns__current')
                field: campaign_id
      - name: source_type
        data_tests:
          - accepted_values:
              arguments:
                values: [touchpoint, membership]

  - name: int_opportunity_source_campaign
    description: >
      One row per opportunity with its source campaign, used for first-touch credit: the source campaign of the
      primary contact role's person, else Opportunity.CampaignId, else 'Unattributed'. An opportunity whose primary
      contact has no source campaign also falls back to Opportunity.CampaignId.
    columns:
      - name: opportunity_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_opportunities__current')
                field: opportunity_id
      - name: source_campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_campaigns__current')
                field: campaign_id
              config:
                where: "source_campaign_id != 'Unattributed'"
      - name: source_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [primary_contact, opportunity_campaign, unattributed]
